name: CI

# Cheap pre-merge sanity. Both Vercel projects do their own typecheck +
# build at deploy time; this workflow catches regressions BEFORE the
# branch is merged, so a broken type doesn't reach `main`. Also lints
# `appcast.xml` because that file is hand-edited on every release and
# Sparkle's parser is unforgiving (audit MEDIUM #31).

on:
  pull_request:
    branches: [main, v2-main]
  push:
    branches: [main, v2-main]

permissions:
  contents: read

jobs:
  backend-typecheck:
    name: Backend (avatars-api) typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - name: npm audit (production deps, high+ severity)
        run: npm audit --production --audit-level=high
        working-directory: backend

  admin-typecheck:
    name: Admin (avatar-admin) typecheck + build
    runs-on: ubuntu-latest
    env:
      # Build-time env so payload.config.ts evaluates without crashing.
      # All values are placeholders — the build doesn't connect anywhere.
      PAYLOAD_SECRET: ci-placeholder
      ADMIN_TOTP_SECRET: ci-placeholder
      ADMIN_MFA_SIGNING_SECRET: ci-placeholder
      UNSUBSCRIBE_SIGNING_SECRET: ci-placeholder
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      # payload-types.ts is gitignored (generated); without it tsc fails on
      # every import of '../payload-types'. Generation only evaluates the
      # config — it never connects to DATABASE_URL. The Payload CLI now and
      # then exits 0 without writing anything (run 33916184338, 2026-09-04),
      # so assert the file and retry instead of trusting the exit code.
      - name: Generate Payload types (asserted, retried)
        working-directory: admin
        run: |
          for attempt in 1 2 3; do
            npm run generate:types
            if [ -s src/payload-types.ts ]; then break; fi
            echo "payload-types.ts missing after attempt $attempt — retrying"
            sleep 5
          done
          test -s src/payload-types.ts
      - run: npx tsc --noEmit
        working-directory: admin
      - run: npx next build
        working-directory: admin
      - name: npm audit (production deps, high+ severity)
        # Advisory for admin until sharp can move to 0.35 (breaking under
        # Payload's peer range) — see plan/GO-NO-GO-2.0.md "Dag-2" (2026-09-04).
        # The backend gate above stays hard.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
        working-directory: admin

  appcast-lint:
    name: Sparkle appcast lint (v1 + v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate appcast structure + Sparkle fields
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET, sys, pathlib

          SPARKLE_ED = "{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"

          def lint(path, allow_empty):
              root = ET.parse(path).getroot()
              items = list(root.iter("item"))
              missing = []
              for item in items:
                  title = (item.findtext("title") or "?").strip()
                  enc = item.find("enclosure")
                  if enc is None:
                      missing.append((title, "no <enclosure>")); continue
                  if not enc.attrib.get("url"):
                      missing.append((title, "enclosure missing url"))
                  if not enc.attrib.get(SPARKLE_ED):
                      missing.append((title, "enclosure missing sparkle:edSignature"))
              if missing:
                  for t, why in missing:
                      print(f"::error file={path}::{t}: {why}")
                  sys.exit(1)
              if not allow_empty and not items:
                  print(f"::error file={path}::expected at least one item")
                  sys.exit(1)
              print(f"{path} ok — {len(items)} item(s)")

          lint("appcast.xml", allow_empty=False)
          v2 = pathlib.Path("appcast-v2.xml")
          if v2.exists():
              lint("appcast-v2.xml", allow_empty=True)
              backend = pathlib.Path("backend/api/_appcast-v2.xml")
              if backend.exists() and v2.read_text() != backend.read_text():
                  print("::error file=backend/api/_appcast-v2.xml::out of lockstep with appcast-v2.xml")
                  sys.exit(1)
          PY
